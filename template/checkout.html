<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EVoltParts - Verify Order</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

            background: #f4f9f4;

        }


        .checkout-container {

            width: 90%;

            max-width: 450px;

            background: white;

            padding: 40px;

            border-radius: 15px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.10);

            text-align: center;

        }


        .logo {

            font-size: 28px;

            font-weight: bold;

            color: #1b4332;

            margin-bottom: 25px;

        }


        .icon {

            width: 70px;

            height: 70px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #d8f3dc;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 30px;

            color: #2d6a4f;

        }


        h1 {

            color: #1b4332;

            margin-bottom: 10px;

        }


        .description {

            color: #666;

            line-height: 1.6;

            margin-bottom: 20px;

        }


        .email {

            font-weight: bold;

            color: #2d6a4f;

            margin-bottom: 25px;

            word-break: break-word;

        }


        .otp-input {

            width: 100%;

            padding: 15px;

            border: 1px solid #ccc;

            border-radius: 8px;

            text-align: center;

            font-size: 22px;

            letter-spacing: 8px;

            outline: none;

        }


        .otp-input:focus {

            border-color: #2d6a4f;

            box-shadow:
                0 0 0 3px rgba(45, 106, 79, 0.12);

        }


        .verify-btn {

            width: 100%;

            margin-top: 20px;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #2d6a4f;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        .verify-btn:hover {

            background: #1b4332;

        }


        .error {

            margin-top: 15px;

            padding: 10px;

            border-radius: 7px;

            background: #fff0f1;

            color: #dc3545;

            font-size: 14px;

        }


        .back-btn {

            display: inline-block;

            margin-top: 20px;

            color: #2d6a4f;

            text-decoration: none;

            font-size: 14px;

        }

    </style>

</head>


<body>


<div class="checkout-container">


    <div class="logo">

        EVoltParts

    </div>


    <div class="icon">

        ✉

    </div>


    <h1>

        Verify Your Order

    </h1>


    <p class="description">

        We've sent a verification code to your

    </p>


    <div class="email">

        {{ email }}

    </div>


    <p class="description">

        Enter the 6-digit OTP to confirm your order.

    </p>


    {% if errormsg %}

        <div class="error">

            {{ errormsg }}

        </div>

    {% endif %}


    <form method="POST"
          action="{% url 'verify_checkout_otp' name=name %}">

        {% csrf_token %}


        <input
            type="text"
            name="verification_code"
            class="otp-input"
            placeholder="000000"
            maxlength="6"
            inputmode="numeric"
            autocomplete="one-time-code"
            required
        >


        <button
            type="submit"
            class="verify-btn">

            Verify & Place Order

        </button>

    </form>


    <a
        href="{% url 'cart' name=name %}"
        class="back-btn">

        ← Back to Cart

    </a>


</div>


</body>

</html>
