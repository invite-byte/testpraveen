<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | EVoltParts - Powering Every Ride.</title>
    {% load static %}
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="{% static 'css/forgetpasscss.css' %}">
</head>
<body class="ev-body auth-page-body">

    <!-- Center the existing OTP layout -->
    <div class="container-fluid min-vh-100 d-flex justify-content-center align-items-center">

        <div
            id="successStateView"
            class="text-center py-4 w-100"
            style="max-width: 450px;"
        >

            <!-- Icon -->
            <div class="ev-success-icon-wrap mx-auto mb-3">
                <i class="fa-solid fa-shield-halved text-accent fs-3"></i>
            </div>

            <h3 class="h4 fw-bold text-white mb-3">
                Enter Verification Code
            </h3>

            <!-- OTP FORM -->
            <form method="post" id="otpForm" action="{% url 'forgetpassotp' %}">

                {% csrf_token %}

                <p name="email" class="text-secondary small mb-4">
                    We've sent a 6-digit verification code to
                    <strong class="text-white">{{ email }}</strong>
                </p>

                <input
                    type="hidden"
                    name="email"
                    value="{{ email }}"
                >

                <div class="mb-4">

                    <label
                        for="verificationCode"
                        class="form-label small fw-medium text-light"
                    >
                        Verification Code
                    </label>

                    <input
                        type="text"
                        name="verification_code"
                        id="verificationCode"
                        class="form-control bg-dark text-white border-secondary border-opacity-25 shadow-none text-center py-3"
                        placeholder="Enter 6-digit code"
                        maxlength="6"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        required
                    >

                </div>

                <!-- Verify Button -->
                <div class="d-grid mb-3">

                    {% if errormsg %}

                    <div>{{errormsg}}</div>
                    
                    {% endif %}

                    <button
                        type="submit"
                        id="verifyCodeBtn"
                        class="btn ev-btn-primary fw-semibold py-3 rounded-3"
                    >

                        <span id="verifyBtnText">
                            Verify Code
                        </span>

                        <span
                            id="verifySpinner"
                            class="spinner-border spinner-border-sm ms-2 d-none"
                            role="status"
                        ></span>

                    </button>

                </div>

            </form>

            <!-- RESEND -->
            <div class="mt-3">

                <p class="text-secondary small mb-0">

                    Didn't receive the code?

                    <button
                        type="button"
                        id="resendCodeBtn"
                        class="btn btn-link text-accent text-decoration-none p-0 ms-1"
                    >
                        Resend Code
                    </button>

                </p>

            </div>

        </div>

    </div>


    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Custom JavaScript -->
    <script src="{% static 'js/forgetpassjs.js' %}"></script>

</body>
```
