<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    {% load static %}

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Successful - EVoltParts</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet"
          href="{% static 'css/registercss.css' %}">

    <style>
        .success-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #successStateContainer {
            width: 100%;
            max-width: 450px;
            padding: 40px 30px !important;
        }

        .ev-success-icon-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body class="ev-body">

    <div class="success-page">

        <div id="successStateContainer" class="text-center">

            <div class="ev-success-icon-wrap mb-3 mx-auto">
                <i class="fa-solid fa-circle-check text-accent display-4"></i>
            </div>

            <h3 class="h4 fw-bold text-white mb-2">
                Account Created Successfully!
            </h3>

            <p class="text-secondary small mb-4">
                Welcome to EVoltParts. Your account is ready.
            </p>

            <a href="/login"
               class="btn ev-btn-primary w-100 fw-semibold py-2 rounded-3 shadow-sm text-decoration-none">
                Continue to Login
            </a>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
